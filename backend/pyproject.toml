[project]
name = "trustrepro"
version = "0.1.0"
description = "TrustRepro backend and deterministic workflow services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "docker>=7,<8",
  "requests>=2.32,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "cryptography>=44,<47",
  "pillow>=12,<13",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustrepro"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
